name: _tmp heroku config + stress

on:
  workflow_dispatch:
    inputs:
      levels:
        description: "concurrency levels"
        required: false
        default: "1 2 4 6 8 12 16 24 32"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Heroku config var names + formation
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o cv.json -w '%{http_code}' \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Authorization: Bearer ${HEROKU_API_KEY}" \
            https://api.heroku.com/apps/pm-server/config-vars)
          echo "config-vars HTTP ${CODE}"
          if [ "$CODE" != "200" ]; then cat cv.json; exit 1; fi
          curl -sS -o form.json -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Authorization: Bearer ${HEROKU_API_KEY}" \
            https://api.heroku.com/apps/pm-server/formation || true
          cat > show.py <<'PY'
import json
cv = json.load(open('cv.json'))
print("== config vars (names only) ==")
for k in sorted(cv):
    v = str(cv[k])
    print(f"  {k}: len={len(v)} head={v[:6]}...")
try:
    f = json.load(open('form.json'))
    print("== formation ==")
    for x in (f if isinstance(f, list) else [f]):
        print(" ", {k: x.get(k) for k in ('type', 'quantity', 'size', 'state') if k in x})
except Exception as e:
    print("formation parse fail:", e)
PY
          python3 show.py

      - name: Streaming stress
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          LEVELS: ${{ github.event.inputs.levels }}
        run: |
          set -uo pipefail
          cat > stress.py <<'PY'
import json, os, subprocess, sys, time, collections
BASE = "https://stream.pencarimovie.com"

def sh(args, timeout=None):
    return subprocess.run(args, capture_output=True, text=True)

cv = sh(["curl", "-sS", "-H", "Accept: application/vnd.heroku+json; version=3",
         "-H", "Authorization: Bearer " + os.environ["HEROKU_API_KEY"],
         "https://api.heroku.com/apps/pm-server/config-vars"])
token = json.loads(cv.stdout).get("SERVER_TOKEN", "")
if not token:
    print("::error::SERVER_TOKEN not set on pm-server"); sys.exit(1)
print(f"token present: len={len(token)}")

st = sh(["curl", "-sS", "-m", "30", BASE + "/api/auth/status", "-H", "X-Auth-Token: " + token])
try:
    d = json.loads(st.stdout)
    print("auth/status:", {k: d.get(k) for k in ("authenticated", "enabled", "ok")})
except Exception:
    print("auth/status raw:", st.stdout[:200])

cat = sh(["curl", "-sS", "-m", "40", BASE + "/catalog/movie/top.json", "-H", "X-Auth-Token: " + token])
metas = (json.loads(cat.stdout).get("metas") or [])
if not metas:
    print("::error::empty catalog"); print(cat.stdout[:300]); sys.exit(1)
item = metas[0]
iid = item["id"]
print(f"item: {iid} | {item.get('name')}")

t0 = time.time()
sl = sh(["curl", "-sS", "-m", "90", f"{BASE}/stream/movie/{iid}.json", "-H", "X-Auth-Token: " + token])
el = time.time() - t0
streams = (json.loads(sl.stdout).get("streams") or [])
print(f"stream count: {len(streams)} in {el:.2f}s")
url = ""
for s in streams:
    u = s.get("url") or ""
    if u:
        print("  URL:", u[:110] + ("..." if len(u) > 110 else ""))
        if not url:
            url = u
    else:
        print("  CARD:", (s.get("name") or ""), "::", (s.get("description") or "").replace("\n", " ")[:80])
if not url:
    print("::error::no playable url - auth or resolve failure"); sys.exit(1)

levels = [int(x) for x in os.environ.get("LEVELS", "1 2 4 8 16 32").split()]
workers = 512

def run_level(C, target, extra, want):
    procs = []
    for _ in range(C):
        args = ["curl", "-sS", "-o", "/dev/null", "-w", "%{http_code} %{time_total} %{size_download}"]
        args += extra + [target]
        procs.append(subprocess.Popen(args, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True))
    codes = collections.Counter(); ts = []; sizes = []
    for p in procs:
        out, _ = p.communicate()
        parts = out.split()
        if len(parts) >= 2:
            codes[parts[0]] += 1
            ts.append(float(parts[1]))
            if len(parts) > 2:
                sizes.append(int(float(parts[2])))
    ts.sort()
    ok = codes.get(want, 0) + (codes.get("200", 0) if want == "206" else 0)
    fails = C - ok
    med = ts[len(ts) // 2] if ts else 0.0
    print(f"C={C:>3} ok={ok:>3} fail={fails:>3} med={med:.2f}s max={(max(ts) if ts else 0):.2f}s "
          f"avgMB={(sum(sizes)/len(sizes)/1048576 if sizes else 0):.2f} codes={dict(codes)}", flush=True)
    return ok, fails

print("\n=== phase A: concurrent /stream/<id>.json (30s cap) ===", flush=True)
for C in levels:
    run_level(C, f"{BASE}/stream/movie/{iid}.json", ["-m", "30", "-H", "X-Auth-Token: " + token], "200")

print("\n=== phase B: concurrent 1MB range downloads (45s cap) ===", flush=True)
for C in levels:
    run_level(C, url, ["-m", "45", "-r", "0-1048575"], "206")

print("\n=== post-load health ===", flush=True)
for i in range(3):
    t0 = time.time()
    r = sh(["curl", "-sS", "-m", "30", "-o", "/dev/null", "-w", "%{http_code}", BASE + "/api/version"])
    print(f"  /api/version -> {r.stdout.strip()} in {time.time()-t0:.2f}s")
PY
          python3 stress.py

      - name: Public reachability after load
        if: always()
        run: |
          curl -sS -m 30 -o /dev/null -w 'version=%{http_code} %{time_total}s\n' https://stream.pencarimovie.com/api/version || true
