name: Deploy to Heroku

# Auto-deploy to Heroku on every push to main.
#
# Why this workflow instead of Heroku's own GitHub integration: this app is on
# the **container** stack (`heroku.yml` -> `Dockerfile`), and the dashboard
# "Automatic deploys" toggle is only offered for buildpack apps. Pushing the git
# ref to Heroku is the supported path for container stacks, so CI does exactly
# what a manual `git push heroku main` does.
#
# Required repository secret: HEROKU_API_KEY
#   Get it with `heroku authorizations:create -d "github-actions pm-server"`
#   or from https://dashboard.heroku.com/account/applications
#   Add it with `gh secret set HEROKU_API_KEY` (or Settings -> Secrets -> Actions).

on:
  push:
    branches: [main]
  # Lets you re-deploy without an empty commit (Actions tab -> Run workflow).
  workflow_dispatch:

# Never run two deploys at once; a later push cancels an in-flight older one.
concurrency:
  group: heroku-deploy
  cancel-in-progress: true

permissions:
  contents: read
  # Pull the native image that `release.yml` publishes as :native.
  packages: read

jobs:
  deploy:
    name: Promote the native image to Heroku
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Heroku needs a non-shallow clone to accept the git fallback below.
          fetch-depth: 0

      # Fail fast with a clear message instead of a confusing auth error.
      - name: Check for HEROKU_API_KEY
        run: |
          if [ -z "${{ secrets.HEROKU_API_KEY }}" ]; then
            echo "::error::Repository secret HEROKU_API_KEY is not set."
            echo "Create one with: heroku authorizations:create -d \"github-actions\""
            echo "Then add it:      gh secret set HEROKU_API_KEY"
            exit 1
          fi

      # Fast path: Heroku's container stack CANNOT pull an external registry image
      # through `heroku.yml` (that always builds a Dockerfile), but the container
      # registry accepts a prebuilt one: pull the CI-built native image (GHCR),
      # retag it for registry.heroku.com and release it. No Rust rebuild per push.
      - name: Deploy the prebuilt image (no rebuild)
        id: image
        continue-on-error: true
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP: pm-server
        run: |
          set -euo pipefail
          IMG="ghcr.io/${{ github.repository }}:native"

          # Public package: no login needed. Private: the workflow token can read
          # this repository's own packages.
          if ! docker pull "$IMG" 2>/dev/null; then
            echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "$IMG"
          fi

          echo "$HEROKU_API_KEY" | docker login --username=_ --password-stdin registry.heroku.com
          docker tag "$IMG" "registry.heroku.com/${HEROKU_APP}/web"
          docker push "registry.heroku.com/${HEROKU_APP}/web"

          # Same effect as `heroku container:release web`.
          curl -sS -X PATCH \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Authorization: Bearer ${HEROKU_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"updates":[{"type":"web"}]}' \
            "https://api.heroku.com/apps/${HEROKU_APP}/formation" -o /dev/null
          echo "Promoted ${IMG} to ${HEROKU_APP}."

      # Fallback: no GHCR image yet (or the pull failed) -> build on Heroku from
      # the commit, which is the slow path this job exists to avoid but must keep
      # working so a push is never a red deploy.
      - name: Deploy by building on Heroku (fallback)
        if: steps.image.outcome != 'success'
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP: pm-server
        run: |
          echo "::notice::No prebuilt image; building on Heroku instead."
          set -euo pipefail

          # Heroku authenticates with the API key as the password and any
          # non-empty username. Keeping it in an env var (never in the URL on
          # disk) avoids leaking it into git config / process listings.
          git remote add heroku "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP}.git"

          # Deploy the exact commit CI checked out.
          git push --force heroku "HEAD:refs/heads/main"

          # Report the release that was just created, so the run is
          # self-verifying. Write to a file first: piping curl straight into
          # `head -c` closes the pipe early, curl then exits 23 (SIGPIPE write
          # error) and `set -o pipefail` turns a successful deploy into a red
          # run. Non-fatal anyway - the push above already printed
          # "Verifying deploy... done."
          if curl -sS --max-time 30 \
               -H "Accept: application/vnd.heroku+json; version=3" \
               -H "Authorization: Bearer ${HEROKU_API_KEY}" \
               "https://api.heroku.com/apps/${HEROKU_APP}/releases" \
               -o /tmp/releases.json; then
            # `head` still truncates, but it is no longer curl's stdout.
            grep -o '"version":[0-9]*' /tmp/releases.json | head -n 1 || true
          else
            echo "Deploy succeeded; release lookup was skipped."
          fi
          echo "Deployed ${HEROKU_APP} at commit ${GITHUB_SHA}."
